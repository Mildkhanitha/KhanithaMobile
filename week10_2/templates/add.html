<doctype html>
<title>Add User - Python Flask MySQL CRUD</title>
<h2>Add User</h2>
<form onsubmit="event.preventDefault(); ins_data();"> <dl>
<input name="inputName" id="iName" value="" type="text" 
       placeholder="Name" autocomplete="off" required>
<p>
<input name="inputEmail" id="iEmail" value="" type="text" 
       placeholder="Email" autocomplete="off" required>
</p>
<p>
<input name="inputPhone" id="iPhone" value="" type="text"
       placeholder="Phone" autocomplete="off" required>
</p>
<p>
<input name="inputaddress" id="iAddress" value="" type="text"
       placeholder="Address" autocomplete="off" required>
</p>
<p>
<input name="inputAge" id="iAge" value="" type="number"
       placeholder="Age" autocomplete="off" required>
</p>
<p>
<input name="inputSubject" id="iSubject" value="" type="text"
       placeholder="Subject" autocomplete="off" required>
</p>
</dl>
<p>
<button type="submit">save</button>
</p>
</form>

<script>
    async function ins_data(){
        const rawResponse = await fetch('/create', {
            method: 'post',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name   : document.getElementById('iName').value, 
                email  : document.getElementById('iEmail').value,
                phone  : document.getElementById('iPhone').value,
                address: document.getElementById('iAddress').value,
                age    : document.getElementById("iAge").value, // ส่งค่า age [cite: 389]
                subject: document.getElementById("iSubject").value // ส่งค่า subject [cite: 389]
            })
        });
      const content = await rawResponse.json();
      alert(content); // แสดงข้อความตอบกลับจาก Server
      console.log(content);
      
      if(rawResponse.status == 200) {
          window.location.href = "/emp"; // ถ้าสำเร็จให้ไปหน้าแสดงข้อมูลทั้งหมด [cite: 379]
      }
    }
</script>
